    <script>
      // Suppress Vite HMR WebSocket proxy closing errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? String(event.reason.message || event.reason) : '';
        if (reason.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message ? String(event.message) : '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
